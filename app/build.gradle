plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
    id 'kotlin-parcelize'
}

// API keys live in local.properties (untracked); -P properties remain as a CI fallback.
def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def apiKey = { String name ->
    localProps.getProperty(name) ?: project.findProperty(name) ?: ""
}

android {
    namespace 'com.linkguard.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.linkguard.app"
        minSdk 26
        targetSdk 34
        versionCode 35
        versionName "1.34"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "VIRUSTOTAL_API_KEY", "\"${apiKey('VIRUSTOTAL_API_KEY')}\""
        buildConfigField "String", "SAFE_BROWSING_API_KEY", "\"${apiKey('SAFE_BROWSING_API_KEY')}\""
        buildConfigField "String", "HYBRID_ANALYSIS_API_KEY", "\"${apiKey('HYBRID_ANALYSIS_API_KEY')}\""
        buildConfigField "String", "NEXTDNS_PROFILE_ID", "\"${apiKey('NEXTDNS_PROFILE_ID')}\""
        buildConfigField "String", "URLHAUS_AUTH_KEY", "\"${apiKey('URLHAUS_AUTH_KEY')}\""
    }

    signingConfigs {
        release {
            def storePath = localProps.getProperty('RELEASE_STORE_FILE')
            if (storePath) {
                storeFile file(storePath)
                storePassword localProps.getProperty('RELEASE_STORE_PASSWORD')
                keyAlias localProps.getProperty('RELEASE_KEY_ALIAS')
                keyPassword localProps.getProperty('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Only sign when the keystore is configured in local.properties
            if (localProps.getProperty('RELEASE_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Room Database with KSP
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    // HTTP Client
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // JSON
    implementation 'com.google.code.gson:gson:2.10.1'

    // Bounded, non-executing HTML parsing for phishing-page inspection
    implementation 'org.jsoup:jsoup:1.17.2'

    // WorkManager
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // CameraX
    def camerax_version = "1.3.4"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"

    // ML Kit Barcode Scanning
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'

    // Unit tests
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'

    // Focused device tests for lifecycle, component exposure, and Room behavior
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.1'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
